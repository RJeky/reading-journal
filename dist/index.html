<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Личная библиотека и прогресс чтения">
<title>Книжная полка</title>
<style>
  @font-face { font-family: Caveat; src: url("caveat.ttf") format("truetype"); font-weight: 400 700; font-display: swap }
  * { box-sizing: border-box }
  :root {
    color-scheme: light;
    font: 16px/1.5 "Trebuchet MS", "Segoe UI", sans-serif;
    color: #171d38;
    background: #f8eddb;
    --ink: #151e49;
    --muted: #555968;
    --rule: #c5b9ac;
    --paper: #fff8e9;
    --plum: #78264f;
    --leaf: #dce29d;
    --serif: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  }
  body { margin: 0 }
  main {
    max-width: 1740px;
    min-height: 100vh;
    margin: auto;
    padding: 0 clamp(20px, 5.25vw, 88px) 54px;
    background: linear-gradient(to right, transparent clamp(11px, 3vw, 52px), #bc68599e clamp(11px, 3vw, 52px), #bc68599e calc(clamp(11px, 3vw, 52px) + 1px), transparent calc(clamp(11px, 3vw, 52px) + 1px)),
      repeating-linear-gradient(to bottom, transparent 0 41px, #a3bad270 41px 42px),
      radial-gradient(ellipse at 12% 0%, #fff8ed, transparent 66%),
      radial-gradient(ellipse at 100% 70%, #f1dfc3, transparent 80%),
      #faf1e4;
  }
  header, .toolbar, .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  header, .toolbar { justify-content: space-between }
  h1, h2 { font-family: var(--serif); font-weight: normal }
  .masthead {
    padding: 13px 0 15px;
    color: var(--ink);
    background: transparent;
    border-bottom: 1px solid #596789;
    min-height: 0;
  }
  .masthead-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px clamp(18px, 3vw, 42px) }
  h1 { font-size: clamp(2.25rem, 4.15vw, 4.2rem); line-height: .96; margin: 0 }
  .masthead nav { display: flex; gap: clamp(14px, 2.6vw, 39px); align-items: center; border-left: 1px solid #9b8e85; padding-left: clamp(14px, 2.8vw, 42px) }
  .jump { position: relative; color: var(--ink); font-weight: bold; text-decoration: none; padding: 7px 1px }
  .jump:hover { color: var(--plum) }
  .jump:first-child::after, .ink-underline::after {
    position: absolute; content: ""; border-top: 2px solid var(--plum);
    left: 0; right: 0; bottom: 0; height: 4px; border-radius: 50%; transform: rotate(-3deg);
  }
  .stats { color: var(--muted); margin: 0 }
  button, input, select, textarea { font: inherit; color: inherit; border: 1px solid #989d90; border-radius: 4px; background: var(--paper); padding: .63rem .8rem }
  select {
    appearance: none;
    padding-inline-end: 2.1rem;
    background-image: linear-gradient(45deg, transparent 49%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 51%);
    background-position: right 16px center, right 11px center;
    background-repeat: no-repeat;
    background-size: 5px 5px;
  }
  button { cursor: pointer }
  button:hover { background-color: #e8eadf; border-color: var(--ink) }
  .primary { background: var(--plum); border-color: #672043; color: white; border-radius: 10px; font-weight: bold }
  .primary:hover { background: #622040; color: white }
  .add-button span { display: inline-block; font-size: 1.45em; line-height: .8; margin-right: .3em; vertical-align: -.06em }
  .toolbar { margin-top: 12px; padding-bottom: 3px; justify-content: flex-start }
  .toolbar input { width: min(100%, 340px) }
  #shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2vw, 25px); margin-top: 16px }
  article { min-width: 0; overflow-wrap: anywhere }
  .book-card { display: grid; grid-template-columns: minmax(64px, 30%) minmax(0, 1fr); align-items: start; gap: 15px; background: #fff8e780; padding: 13px; border: 1px solid #aaaaaf; border-radius: 13px }
  .book-card h2 { margin: 3px 0 5px; font: bold clamp(1.06rem, 1.6vw, 1.55rem)/1.12 "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink) }
  .book-cover { display: grid; width: 100%; aspect-ratio: 2 / 3; border-radius: 5px 8px 8px 4px; overflow: hidden; box-shadow: -3px 2px 0 #67748b, 0 7px 12px #201d2b31; background: #173454 url("notebook-cover.png") center / cover; color: #fffaed; position: relative }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0 }
  .book-cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #10122480, #ffffff26 3%, #10122432 6%, transparent 9%) }
  .cover-letters { padding: 12% 9%; font: clamp(1.05rem, 2vw, 2rem)/1.02 var(--serif); text-shadow: 0 1px 4px #10182c; text-align: center; overflow-wrap: anywhere; min-width: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden }
  .details { color: var(--muted) }
  .cover-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  #cover-preview { width: 56px; height: 78px; object-fit: contain }
  #cover-preview[hidden], #cover-remove[hidden], #total-label[hidden], #custom-genre-label[hidden], #finished-label[hidden] { display: none }
  input[type="file"] { max-width: 100%; min-width: 0 }
  #form-error, #session-error { color: #7d3829; margin: 0 }
  #form-error:empty, #session-error:empty { display: none }
  #session-book { margin: 0; color: var(--muted) }
  article p { margin: 8px 0 }
  .note { white-space: pre-wrap }
  .state { display: inline-block; color: var(--ink); background: #e7ede4; padding: 2px 8px; font-size: .9rem; font-weight: bold }
  article[data-status="planned"] .state { background: #f3e7d5; color: #684a2f }
  progress { width: 100%; accent-color: var(--plum) }
  .actions { margin-top: 15px }
  #empty { margin: 20px 0; padding: 34px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); background: var(--paper) }
  #empty:empty { display: none }
  dialog { width: min(520px, calc(100% - 24px)); max-height: calc(100dvh - 24px); border: 1px solid var(--rule); border-top: 4px solid #a87f4e; border-radius: 6px; padding: 22px; background: var(--paper); color: inherit }
  dialog::backdrop { background: #17271fe0 }
  form { display: grid; gap: 12px }
  form h2 { margin: 0; color: var(--ink); font-size: 1.8rem; line-height: 1.16 }
  .editor-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 10px }
  .close-dialog { display: grid; flex: 0 0 44px; width: 44px; height: 44px; place-items: center; font-size: 1.65rem; line-height: 1; padding: 0 }
  #catalog-form { margin-top: 16px }
  #catalog-results { list-style: none; padding: 0 }
  #catalog-results li { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--rule); padding: 11px 0 }
  #catalog-results img { width: 38px; height: 54px; object-fit: contain }
  .catalog-book { flex: 1; min-width: 0; overflow-wrap: anywhere }
  .catalog-book p { margin: 0 }
  #catalog-message, .catalog-source { margin: 12px 0 0; color: var(--muted) }
  .catalog-source a { color: var(--ink) }
  label { display: grid; gap: 5px }
  .pages { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
  .pages label, .pages input, .pages select { width: 100%; min-width: 0 }
  #notice { min-height: 1.4em; color: #7d3829 }
  :focus-visible { outline: 2px solid #446a50; outline-offset: 3px }
  .masthead :focus-visible { outline-color: var(--ink) }
  .journal-section { margin-top: 28px }
  .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap }
  .section-heading h2, .year-heading h2 { margin: 0; line-height: 1; font-size: clamp(2.6rem, 4.5vw, 4rem); color: var(--ink) }
  .ink-underline { position: relative; display: inline-block; padding-bottom: 7px }
  .section-heading .ink-underline::after { border-color: #828e39 }
  .opening { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: clamp(24px, 4.1vw, 67px); align-items: center; padding: clamp(32px, 4vw, 64px) 0 clamp(30px, 3.4vw, 52px); border-bottom: 1px solid #596789 }
  .featured-card { display: grid; grid-template-columns: minmax(112px, 38%) minmax(0, 1fr); align-items: center; gap: clamp(15px, 3vw, 52px) }
  .featured-card .book-cover { aspect-ratio: 0.72; box-shadow: -5px 4px 0 #59677f, -8px 7px 1px #24314fa1, 0 11px 16px #3020363d }
  .featured-card .cover-letters { padding-top: 22%; font-size: clamp(1.75rem, 3.7vw, 4rem) }
  .featured-card h2 { font-size: clamp(2.65rem, 6vw, 6.15rem); color: var(--ink); margin: 9px 0 2px; line-height: .94; overflow-wrap: anywhere }
  .featured-card .author { font-size: clamp(1.05rem, 2vw, 1.65rem); color: var(--ink) }
  .highlight { display: inline-block; color: var(--ink); padding: 0 .48em .08em; background: var(--leaf); font: bold clamp(1.7rem, 3.1vw, 3rem)/1 var(--serif); transform: rotate(-2deg); border-radius: 15% 7% 13% 4% }
  .featured-card .actions { align-items: center; gap: 9px 13px }
  .featured-card .actions .primary { padding: .67em 1em; font-size: clamp(.95rem, 1.4vw, 1.3rem) }
  .featured-card .actions .primary::before { content: "✎"; margin-right: .5em }
  .card-actions button:not(.primary), .featured-card .actions button:not(.primary) { background: transparent; border-color: transparent; color: var(--plum); padding: .25em .1em; text-decoration: underline; text-underline-offset: 3px; }
  .card-actions button:not(.primary):hover, .featured-card .actions button:not(.primary):hover { color: var(--ink) }
  .hero-progress { display: flex; align-items: center; gap: 12px; margin-top: 15px; color: var(--ink); font: bold clamp(1.8rem, 3.4vw, 3.3rem)/1 var(--serif) }
  .hero-progress progress { flex: 1; min-width: 18px; height: clamp(12px, 2vw, 23px); appearance: none; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; background: transparent }
  .hero-progress progress::-webkit-progress-bar { background: transparent }
  .hero-progress progress::-webkit-progress-value { background: repeating-linear-gradient(123deg, var(--plum) 0 2px, #dc9abb 2px 3px); border-radius: 999px }
  .hero-progress progress::-moz-progress-bar { background: repeating-linear-gradient(123deg, var(--plum) 0 2px, #dc9abb 2px 3px); border-radius: 999px }
  #year-slip { position: relative; padding: clamp(18px, 2.7vw, 44px) clamp(19px, 2.75vw, 43px); color: var(--ink); background: linear-gradient(135deg, #e8e9a9, #f1edc1 74%); border-radius: 3px 5px 15px 3px; box-shadow: -4px 7px 13px #594b3538; transform: rotate(.8deg) }
  #year-slip::before { content: ""; position: absolute; inset: 10px auto 10px 6px; width: 11px; background: radial-gradient(circle at center, #a2a47280 0 2px, #f9efd9 3px 5px, transparent 5.5px) center top / 11px 23px repeat-y }
  #year-slip::after { content: ""; position: absolute; top: -13px; right: 17px; width: 13px; height: 45px; border: 2px solid var(--plum); border-radius: 11px; box-shadow: 2px 2px 0 #5d52294d; transform: rotate(13deg); pointer-events: none }
  #year-slip h2 { margin: 0 0 13px; color: var(--plum); font: bold clamp(2.1rem, 3.9vw, 4rem)/.95 var(--serif) }
  .slip-line { margin: 0 0 5px; font: bold clamp(1.55rem, 2.85vw, 2.9rem)/1 var(--serif); white-space: nowrap }
  .slip-line output { display: inline-block; padding: .08em .25em; border: 2px solid #959f50; border-radius: 53% 45% 47% 45%; transform: rotate(-4deg); font-size: 1.14em; min-width: 1.33em; text-align: center }
  .slip-chart { height: clamp(58px, 8vw, 128px); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: end; column-gap: clamp(3px, .48vw, 9px); padding: 0 1px; border-bottom: 2px solid var(--ink); margin: 12px 0 7px }
  .slip-bar { min-height: 2px; border: 1px solid var(--plum); border-radius: 2px 2px 0 0; background: repeating-linear-gradient(130deg, #7d2b51 0 1px, transparent 1px 4px) }
  .slip-link { color: var(--plum); font-size: .9rem }
  .year-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px }
  .year-heading label { display: flex; align-items: center; gap: 8px }
  .year-heading a { color: var(--ink) }
  .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 205px), 1fr)); gap: 12px; margin-top: 12px }
  .year-card { min-width: 0; padding: 13px 16px; border: 1px solid #d5c4a2; background: #fff9e9; box-shadow: 1px 2px 0 #e1d3b7; overflow-wrap: anywhere }
  .year-card:nth-child(3n + 2) { border-color: #c0c9d8; background: #edf1f7; box-shadow: 1px 2px 0 #cdd6e3 }
  .year-card:nth-child(3n) { border-color: #d9bdb1; background: #f7ebe4; box-shadow: 1px 2px 0 #e3c9bb }
  .year-card h3 { margin: 0; font: 2rem/1 var(--serif); color: var(--ink) }
  .year-card p { margin: 8px 0 0; font-size: 1.08rem; font-weight: bold }
  .year-card small { display: block; color: var(--muted); font-size: .89rem }
  #year-note { color: var(--muted); margin: 12px 0 }
  #history { margin-top: 14px; background: var(--paper); border: 1px solid var(--rule); padding: 10px 14px }
  #history summary { color: var(--ink); cursor: pointer }
  #history-list { margin: 0; padding: 0; list-style: none }
  #history-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); margin-top: 7px; padding-top: 7px; overflow-wrap: anywhere }
  #history-list button { padding: .3rem .55rem }
  .history-actions { display: flex; gap: 5px; flex-wrap: wrap }
  @media (max-width: 1000px) {
    #shelf { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  }
  @media (max-width: 760px) {
    .opening { grid-template-columns: 1fr; gap: 28px }
    #year-slip { transform: none }
    .masthead nav { border-left: 0; padding-left: 0 }
    .featured-card h2 { font-size: clamp(2.65rem, 8.8vw, 4.5rem) }
  }
  @media (max-width: 570px) {
    .masthead { gap: 8px 16px }
    #shelf { grid-template-columns: 1fr }
    .toolbar > * { width: 100% }
    .pages { grid-template-columns: 1fr }
  }
</style>
<main>
  <header class="masthead">
    <div class="masthead-title">
      <h1 class="ink-underline">Читательский дневник</h1>
      <nav aria-label="Разделы дневника">
        <a class="jump" href="#shelf-section">Полка</a>
        <a class="jump" href="#year-review">Итоги года</a>
      </nav>
    </div>
    <button class="primary add-button" id="add"><span aria-hidden="true">+</span> Добавить книгу</button>
  </header>
  <div class="opening">
    <section id="featured" aria-label="Сейчас читаю"></section>
    <aside id="year-slip" aria-labelledby="year-slip-title">
      <h2 class="ink-underline" id="year-slip-title">Мой год в книгах</h2>
      <p class="slip-line"><output id="slip-books">0</output> <span id="slip-books-label">книг</span></p>
      <p class="slip-line"><output id="slip-pages">0</output> <span id="slip-pages-label">страниц</span></p>
      <div class="slip-chart" id="slip-chart" role="img" aria-label="Страницы по месяцам"></div>
      <a href="#year-review" class="slip-link" id="slip-link">Подробные итоги</a>
    </aside>
  </div>
  <section class="journal-section" id="shelf-section" aria-labelledby="shelf-title">
    <div class="section-heading">
      <h2 class="ink-underline" id="shelf-title">Моя полка</h2>
      <p class="stats" id="stats"></p>
    </div>
    <div class="toolbar">
      <input id="search" type="search" aria-label="Поиск по названию и автору" placeholder="Название или автор">
      <select id="filter" aria-label="Статус книги">
        <option value="">Все книги</option><option value="planned">Хочу прочитать</option>
        <option value="reading">Читаю</option><option value="done">Прочитано</option>
      </select>
      <button id="open-catalog">Найти в каталоге</button>
    </div>
    <div id="shelf"></div><p id="empty"></p><p id="notice" role="status"></p>
  </section>
  <section class="journal-section" id="year-review" aria-labelledby="year-title">
    <div class="year-heading"><h2 id="year-title">Мой год в книгах</h2><label>Год <select id="review-year"></select></label></div>
    <div class="year-grid" id="year-grid"></div>
    <p id="year-note"></p>
    <details id="history"><summary>Записи о чтении</summary><ul id="history-list"></ul></details>
  </section>
</main>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="book-form">
    <div class="editor-header">
      <h2 id="editor-title">Добавить книгу</h2>
      <button type="button" class="close-dialog" id="close-editor" aria-label="Закрыть окно" title="Закрыть окно">×</button>
    </div>
    <label>Название<input name="title" required maxlength="240" autofocus></label>
    <label>Автор<input name="author" maxlength="160"></label>
    <div class="pages">
      <label>Формат<select name="format"><option value="">Не указан</option><option value="ebook">Электронная</option><option value="paperback">Мягкий переплёт</option><option value="hardcover">Твёрдый переплёт</option></select></label>
      <label>Жанр<select name="genre">
        <option value="">Не указан</option>
        <optgroup label="Художественная литература">
          <option>Классика</option><option>Современная проза</option><option>Детектив</option>
          <option>Триллер</option><option>Ужасы</option><option>Фантастика</option>
          <option>Фэнтези</option><option>Любовный роман</option><option>Исторический роман</option>
          <option>Приключения</option><option>Поэзия</option><option>Комиксы и графические романы</option>
          <option>Детская литература</option>
        </optgroup>
        <optgroup label="Нехудожественная литература">
          <option>Биография и мемуары</option><option>История</option><option>Научпоп</option>
          <option>Психология</option><option>Саморазвитие</option><option>Бизнес и экономика</option>
          <option>Философия</option><option>Искусство</option>
        </optgroup>
        <option value="__custom__">Свой жанр</option>
      </select></label>
    </div>
    <label id="custom-genre-label" hidden>Свой жанр<input name="customGenre" maxlength="100" disabled></label>
    <label>Статус<select name="status"><option value="planned">Хочу прочитать</option><option value="reading">Читаю</option><option value="done">Прочитано</option></select></label>
    <label id="finished-label" hidden>Дата окончания<input name="finishedOn" type="date" disabled></label>
    <label>Единица прогресса<select name="unit"><option value="page">Страница</option><option value="location">Место</option><option value="percent">Процент</option></select></label>
    <div class="pages">
      <label><span id="position-caption">Текущая страница</span><input name="position" type="number" min="0" step="1" value="0"></label>
      <label id="total-label"><span id="total-caption">Всего страниц</span><input name="total" type="number" min="1" step="1"></label>
    </div>
    <label>Обложка<input name="coverFile" type="file" accept="image/*"></label>
    <div class="cover-controls"><img id="cover-preview" alt="Предпросмотр обложки" hidden><button type="button" id="cover-remove" hidden>Убрать обложку</button></div>
    <label>Заметка<textarea name="note" rows="3" maxlength="5000"></textarea></label>
    <p id="form-error" role="alert"></p>
    <div class="actions"><button type="submit" class="primary">Сохранить</button><button type="button" id="cancel">Отмена</button></div>
  </form>
</dialog>
<dialog id="session" aria-labelledby="session-title">
  <form id="session-form">
    <div class="editor-header">
      <h2 id="session-title">Запись о чтении</h2>
      <button type="button" class="close-dialog" id="close-session" aria-label="Закрыть запись">×</button>
    </div>
    <p id="session-book"></p>
    <label>Дата<input name="date" type="date" required></label>
    <div class="pages">
      <label>Прочитано страниц<input name="pages" type="number" min="1" max="100000" step="1"></label>
      <label>Затрачено минут<input name="minutes" type="number" min="1" max="1440" step="1"></label>
    </div>
    <p id="session-error" role="alert"></p>
    <button class="primary" type="submit">Записать</button>
  </form>
</dialog>
<dialog id="catalog" aria-labelledby="catalog-title">
  <div class="editor-header">
    <h2 id="catalog-title">Поиск в каталоге</h2>
    <button type="button" class="close-dialog" id="close-catalog" aria-label="Закрыть поиск" title="Закрыть поиск">×</button>
  </div>
  <form id="catalog-form">
    <label>Название, автор или ISBN<input type="search" id="catalog-query" maxlength="200" required autofocus></label>
    <button class="primary" type="submit" id="catalog-submit">Найти</button>
  </form>
  <p id="catalog-message" role="status"></p>
  <ul id="catalog-results" aria-label="Результаты поиска"></ul>
  <p class="catalog-source">Источник — <a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a></p>
</dialog>
<script>
  const key = 'reading-tracker-v1';
  const labels = { planned: 'Хочу прочитать', reading: 'Читаю', done: 'Прочитано' };
  const formats = { ebook: 'Электронная', paperback: 'Мягкий переплёт', hardcover: 'Твёрдый переплёт' };
  const customGenre = '__custom__';
  const units = {
    page: { current: 'Текущая страница', total: 'Всего страниц', short: 'стр.' },
    location: { current: 'Текущее место', total: 'Всего мест', short: 'место' },
    percent: { current: 'Прочитано, %' }
  };
  const byId = id => document.getElementById(id);
  const editor = byId('editor');
  const form = byId('book-form');
  const fields = form.elements;
  const notice = byId('notice');
  let books = [];
  let sessions = [];
  let editingId = null;
  let draftCover = '';
  let coverRequest = 0;
  let database;
  let writing = false;

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('reading-tracker', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('library');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function readLibrary() {
    return new Promise((resolve, reject) => {
      const request = database.transaction('library').objectStore('library').get('books');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function save(next, nextSessions = sessions) {
    if (!database || writing) return false;
    writing = true;
    try {
      await new Promise((resolve, reject) => {
        const transaction = database.transaction('library', 'readwrite');
        transaction.oncomplete = resolve;
        transaction.onabort = () => reject(transaction.error);
        transaction.objectStore('library').put({ books: next, sessions: nextSessions }, 'books');
      });
    } catch {
      notice.textContent = 'Браузер не сохранил изменения. Проверьте настройки хранения данных.';
      return false;
    } finally {
      writing = false;
    }
    books = next;
    sessions = nextSessions;
    notice.textContent = '';
    render();
    renderReview();
    return true;
  }

  function openEditor(book, suggestedBook) {
    form.reset();
    coverRequest++;
    draftCover = book?.cover ?? suggestedBook?.cover ?? '';
    showCover();
    editingId = book?.id ?? null;
    byId('editor-title').textContent = book ? 'Редактировать книгу' : 'Добавить книгу';
    fields.title.setCustomValidity('');
    fields.position.setCustomValidity('');
    byId('form-error').textContent = '';
    form.querySelector('button[type="submit"]').disabled = false;
    if (book) {
      for (const field of ['title', 'author', 'status', 'total', 'note', 'format', 'finishedOn']) {
        fields[field].value = book[field] ?? '';
      }
      const genre = book.genre ?? '';
      if (genre !== customGenre && Array.from(fields.genre.options).some(option => option.value === genre)) {
        fields.genre.value = genre;
      } else {
        fields.genre.value = customGenre;
        fields.customGenre.value = genre;
      }
      fields.unit.value = book.unit ?? 'page';
      fields.position.value = book.position ?? book.page ?? 0;
    }
    if (suggestedBook) {
      fields.title.value = suggestedBook.title.slice(0, 240);
      fields.author.value = suggestedBook.author.slice(0, 160);
    }
    updateUnit();
    updateGenre();
    updateFinishedDate();
    editor.showModal();
  }

  function localDate(date = new Date()) {
    const pad = value => String(value).padStart(2, '0');
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
  }

  function updateFinishedDate() {
    const finished = fields.status.value === 'done';
    byId('finished-label').hidden = !finished;
    fields.finishedOn.disabled = !finished;
    fields.finishedOn.max = localDate();
  }

  function updateGenre() {
    const custom = fields.genre.value === customGenre;
    byId('custom-genre-label').hidden = !custom;
    fields.customGenre.disabled = !custom;
    fields.customGenre.required = custom;
    fields.customGenre.setCustomValidity('');
  }

  function updateUnit() {
    const unit = fields.unit.value;
    const percent = unit === 'percent';
    byId('position-caption').textContent = units[unit].current;
    byId('total-caption').textContent = units[unit].total ?? '';
    byId('total-label').hidden = percent;
    fields.total.disabled = percent;
    if (percent) fields.position.max = 100;
    else fields.position.removeAttribute('max');
    fields.position.step = percent ? 'any' : '1';
  }

  function showCover() {
    const preview = byId('cover-preview');
    preview.hidden = !draftCover;
    byId('cover-remove').hidden = !draftCover;
    if (draftCover) preview.src = draftCover;
    else preview.removeAttribute('src');
  }

  async function resizeCover(file) {
    if (file.size > 20 * 1024 * 1024) throw new Error('Выберите изображение размером до 20 МБ.');
    const bitmap = await createImageBitmap(file);
    try {
      const scale = Math.min(1, 420 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext('2d');
      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', .82);
    } finally {
      bitmap.close();
    }
  }

  function element(tag, value, className) {
    const node = document.createElement(tag);
    node.textContent = value;
    if (className) node.className = className;
    return node;
  }

  const catalog = byId('catalog');
  const catalogButton = byId('open-catalog');
  const catalogSubmit = byId('catalog-submit');
  const catalogMessage = byId('catalog-message');
  const catalogResults = byId('catalog-results');
  const catalogCache = new Map();
  let catalogRequest;
  let lastCatalogRequest = 0;

  function showCatalogResults(results) {
    catalogResults.replaceChildren();
    catalogMessage.textContent = results.length ? '' : 'Книги не найдены. Попробуйте другое название, автора или ISBN.';
    for (const book of results) {
      const row = element('li', '');
      if (book.cover) {
        const image = element('img', '');
        image.alt = '';
        image.referrerPolicy = 'no-referrer';
        image.loading = 'lazy';
        image.onerror = () => image.remove();
        image.src = book.cover;
        row.append(image);
      }
      const details = element('div', '', 'catalog-book');
      details.append(element('strong', book.title));
      if (book.author) details.append(element('p', book.author, 'details'));
      const choose = element('button', 'Выбрать');
      choose.setAttribute('aria-label', 'Выбрать книгу «' + book.title + '»');
      choose.onclick = () => {
        catalog.close();
        openEditor(null, book);
      };
      row.append(details, choose);
      catalogResults.append(row);
    }
  }

  catalogButton.disabled = true;
  catalogButton.onclick = () => catalog.showModal();
  byId('close-catalog').onclick = () => catalog.close();
  catalog.onclose = () => {
    if (!catalogRequest) return;
    catalogRequest.abort();
    catalogRequest = undefined;
    catalogSubmit.disabled = false;
    catalogMessage.textContent = '';
  };
  byId('catalog-form').onsubmit = async event => {
    event.preventDefault();
    const query = byId('catalog-query').value.trim();
    if (!query || catalogRequest) return;
    const cacheKey = query.toLocaleLowerCase('ru');
    if (catalogCache.has(cacheKey)) {
      showCatalogResults(catalogCache.get(cacheKey));
      return;
    }
    if (Date.now() - lastCatalogRequest < 1000) {
      catalogMessage.textContent = 'Подождите секунду перед следующим запросом.';
      return;
    }
    const request = new AbortController();
    catalogRequest = request;
    lastCatalogRequest = Date.now();
    catalogSubmit.disabled = true;
    catalogResults.replaceChildren();
    catalogMessage.textContent = 'Ищем книги…';
    const timeout = setTimeout(() => request.abort(), 12000);
    try {
      const isbn = query.replace(/[-\s]/g, '');
      const params = new URLSearchParams({
        q: /^(?:\d{13}|\d{9}[\dXx])$/.test(isbn) ? 'isbn:' + isbn : query,
        fields: 'title,author_name,cover_i',
        limit: '10'
      });
      const response = await fetch('https://openlibrary.org/search.json?' + params, { signal: request.signal });
      if (!response.ok) throw new Error('Catalog unavailable');
      const data = await response.json();
      const books = data.docs.filter(item => typeof item.title === 'string').map(item => ({
        title: item.title,
        author: Array.isArray(item.author_name) ? item.author_name.join(', ') : '',
        cover: Number.isSafeInteger(item.cover_i) && item.cover_i > 0
          ? 'https://covers.openlibrary.org/b/id/' + item.cover_i + '-M.jpg?default=false' : ''
      }));
      if (catalogCache.size >= 30) catalogCache.delete(catalogCache.keys().next().value);
      catalogCache.set(cacheKey, books);
      if (catalogRequest === request) showCatalogResults(books);
    } catch {
      if (catalogRequest === request) catalogMessage.textContent = 'Каталог временно недоступен. Повторите поиск позже или добавьте книгу вручную.';
    } finally {
      clearTimeout(timeout);
      if (catalogRequest === request) {
        catalogRequest = undefined;
        catalogSubmit.disabled = false;
      }
    }
  };

  function currentBook() {
    const activity = new Map();
    for (const session of sessions) {
      if (session.date >= (activity.get(session.bookId) ?? '')) activity.set(session.bookId, session.date);
    }
    return books.filter(book => book.status === 'reading').reduce((current, book) => {
      const rank = item => [activity.get(item.id) ?? '', item.updatedAt ?? ''].sort().at(-1);
      return !current || rank(book) > rank(current) ? book : current;
    }, null);
  }

  function render() {
    const shelf = byId('shelf');
    const featured = currentBook();
    const filter = byId('filter').value;
    const query = byId('search').value.trim().toLocaleLowerCase('ru');
    const matches = books.filter(book =>
      (!filter || book.status === filter) &&
      (book.title + ' ' + book.author).toLocaleLowerCase('ru').includes(query)
    );
    const visible = filter || query ? matches : matches.filter(book => book !== featured);
    byId('stats').textContent = 'Всего ' + books.length + ' · Читаю ' +
      books.filter(book => book.status === 'reading').length + ' · Прочитано ' +
      books.filter(book => book.status === 'done').length;
    byId('empty').textContent = visible.length || (!filter && !query && featured) ? '' : books.length ?
      'По заданным условиям книг нет.' : 'Добавьте первую книгу, чтобы начать.';
    shelf.replaceChildren(...visible.map(book => createBookCard(book)));
    byId('featured').replaceChildren(featured ? createBookCard(featured, true) : createFeaturedPrompt());
  }

  function createCover(book) {
    const frame = element('div', '', 'book-cover');
    frame.setAttribute('aria-hidden', 'true');
    if (book?.title) frame.append(element('span', book.title, 'cover-letters'));
    if (book?.cover) {
      const cover = element('img', '');
      cover.alt = '';
      cover.referrerPolicy = 'no-referrer';
      cover.onerror = () => cover.remove();
      cover.src = book.cover;
      frame.append(cover);
    }
    return frame;
  }

  function createFeaturedPrompt() {
    const card = element('article', '', 'featured-card');
    const content = element('div', '');
    const actions = element('div', '', 'actions');
    const add = element('button', 'Начать читать книгу', 'primary');
    add.onclick = () => {
      if (byId('add').disabled) return;
      openEditor();
      fields.status.value = 'reading';
      updateFinishedDate();
    };
    actions.append(add);
    content.append(element('span', 'Сейчас читаю', 'highlight'), element('h2', 'Что читаешь сейчас?'), actions);
    card.append(createCover(), content);
    return card;
  }

  function createBookCard(book, featured = false) {
    const card = element('article', '', featured ? 'featured-card' : 'book-card');
    card.dataset.status = book.status;
    const content = element('div', '');
    const status = featured ? 'Сейчас читаю' : labels[book.status];
    content.append(element('div', status, featured ? 'highlight' : 'state'), element('h2', book.title));
    if (book.author) content.append(element('p', book.author, 'author'));
    const details = [formats[book.format], book.genre].filter(Boolean);
    if (details.length) content.append(element('p', details.join(' · '), 'details'));
    const unit = book.unit ?? 'page';
    const position = book.position ?? book.page ?? 0;
    const total = unit === 'percent' ? 100 : book.total;
    const positionLabel = unit === 'percent' ? position + '%' :
      unit === 'location' ? 'Место ' + position + (total ? ' из ' + total : '') :
      position + (total ? ' из ' + total : '') + ' ' + units.page.short;
    if (total) {
      const progress = element('progress', '');
      progress.max = total;
      progress.value = position;
      progress.setAttribute('aria-label', 'Прогресс чтения');
      progress.setAttribute('aria-valuetext', positionLabel);
      if (featured) {
        const meter = element('div', '', 'hero-progress');
        const percent = unit === 'percent' ? position : Math.round(position / total * 100);
        meter.append(progress, element('span', numbers.format(percent) + '%'));
        content.append(meter);
        if (unit !== 'percent') content.append(element('p', positionLabel, 'details'));
      } else {
        content.append(element('p', positionLabel), progress);
      }
    } else if (position) {
      content.append(element('p', positionLabel));
    }
    if (book.note) content.append(element('p', book.note, 'note'));
    if (book.finishedOn) content.append(element('p', 'Закончена ' + readableDate(book.finishedOn), 'details'));
    const actions = element('div', '', 'actions card-actions');
    if (book.status !== 'planned') {
      const log = element('button', 'Записать чтение', 'primary');
      log.onclick = () => openSession(book);
      actions.append(log);
    }
    const edit = element('button', 'Изменить');
    edit.onclick = () => openEditor(book);
    const remove = element('button', 'Удалить');
    remove.onclick = () => {
      if (confirm('Удалить книгу «' + book.title + '»?')) save(books.filter(item => item.id !== book.id));
    };
    actions.append(edit, remove);
    content.append(actions);
    card.append(createCover(book), content);
    return card;
  }

  const yearSelect = byId('review-year');
  const numbers = new Intl.NumberFormat('ru');
  const dates = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long' });
  const fullDates = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long', year: 'numeric' });
  const months = new Intl.DateTimeFormat('ru', { month: 'long' });
  const plurals = new Intl.PluralRules('ru');
  const sessionDialog = byId('session');
  const sessionForm = byId('session-form');
  const sessionFields = sessionForm.elements;
  let sessionBook;
  let editingSession;

  function readableDate(date, formatter = fullDates) {
    return formatter.format(new Date(date + 'T12:00:00'));
  }

  function readTime(minutes) {
    return [Math.floor(minutes / 60) ? numbers.format(Math.floor(minutes / 60)) + ' ч' : '',
      minutes % 60 || !minutes ? (minutes % 60) + ' мин' : ''].filter(Boolean).join(' ');
  }

  function leaders(counts) {
    const max = Math.max(0, ...counts.values());
    const names = Array.from(counts).filter(([, count]) => count === max).map(([name]) => name);
    return { names, max };
  }

  function favorite(completed, field) {
    const counts = new Map();
    const names = new Map();
    for (const book of completed) {
      const name = (book[field] ?? '').trim();
      if (!name) continue;
      const key = name.toLocaleLowerCase('ru').replace(/ё/g, 'е');
      if (!names.has(key)) names.set(key, name);
      counts.set(key, (counts.get(key) ?? 0) + 1);
    }
    const top = leaders(counts);
    return [top.names.map(key => names.get(key)).join(', ') || 'Пока нет данных',
      top.max ? (top.names.length === 1 ? 'Книг прочитано — ' : 'Книг у каждого лидера — ') + top.max :
        'По книгам, законченным в этом году'];
  }

  function renderYearSlip(year, completed, pages, byMonth) {
    byId('slip-books').textContent = numbers.format(completed);
    byId('slip-pages').textContent = numbers.format(pages);
    const bookForms = { one: 'книга', few: 'книги', many: 'книг' };
    const pageForms = { one: 'страница', few: 'страницы', many: 'страниц' };
    byId('slip-books-label').textContent = bookForms[plurals.select(completed)];
    byId('slip-pages-label').textContent = pageForms[plurals.select(pages)];
    byId('slip-link').textContent = 'Итоги за ' + year + ' год';
    const peak = Math.max(1, ...byMonth);
    const descriptions = [];
    const bars = byMonth.map((count, index) => {
      const label = months.format(new Date(Number(year), index, 1)) + ' — ' + numbers.format(count) + ' стр.';
      descriptions.push(label);
      const bar = element('span', '', 'slip-bar');
      bar.title = label;
      bar.style.height = (count / peak * 100) + '%';
      bar.setAttribute('aria-hidden', 'true');
      return bar;
    });
    const chart = byId('slip-chart');
    chart.setAttribute('aria-label', 'Страницы по месяцам. ' + descriptions.join(', '));
    chart.replaceChildren(...bars);
  }

  function renderReview() {
    const thisYear = localDate().slice(0, 4);
    const years = new Set([thisYear]);
    for (const book of books) {
      if (book.finishedOn) years.add(book.finishedOn.slice(0, 4));
    }
    for (const session of sessions) years.add(session.date.slice(0, 4));
    const selected = years.has(yearSelect.value) ? yearSelect.value : thisYear;
    yearSelect.replaceChildren(...Array.from(years).sort().reverse().map(year => element('option', year)));
    yearSelect.value = selected;
    const completed = books.filter(book => book.status === 'done' && book.finishedOn?.startsWith(selected + '-'));
    const activity = sessions.filter(session => session.date.startsWith(selected + '-'));
    const pagesByDay = new Map();
    const byMonth = Array(12).fill(0);
    let pages = 0;
    let minutes = 0;
    for (const session of activity) {
      pages += session.pages;
      byMonth[Number(session.date.slice(5, 7)) - 1] += session.pages;
      minutes += session.minutes;
      if (session.pages) pagesByDay.set(session.date, (pagesByDay.get(session.date) ?? 0) + session.pages);
    }
    const days = Array.from(new Set(activity.map(session => session.date))).sort();
    const best = leaders(pagesByDay);
    renderYearSlip(selected, completed.length, pages, byMonth);
    const cards = [
      ['Книг прочитано', numbers.format(completed.length), 'По датам окончания'],
      ['Страниц прочитано', numbers.format(pages), 'По записям о чтении'],
      ['Время за книгами', minutes ? readTime(minutes) : 'Пока нет данных',
        days.length ? 'Дней с записями — ' + days.length : 'Укажи минуты при записи чтения'],
      ['Период чтения', days.length ? readableDate(days[0], dates) +
        (days.length > 1 ? ' — ' + readableDate(days.at(-1), dates) : '') : 'Пока нет данных', 'От первой записи до последней'],
      ['Самый читаемый автор', ...favorite(completed, 'author')],
      ['Любимый жанр', ...favorite(completed, 'genre')],
      ['Рекордный день', best.names.length ? best.names.sort().map(day => readableDate(day, dates)).join(', ') : 'Пока нет данных',
        best.max ? numbers.format(best.max) + ' стр. за день' : 'По страницам, записанным за день']
    ];
    byId('year-grid').replaceChildren(...cards.map(([label, value, detail]) => {
      const card = element('article', '', 'year-card');
      card.append(element('h3', label), element('p', value), element('small', detail));
      return card;
    }));
    const undated = books.filter(book => book.status === 'done' && !book.finishedOn).length;
    const notes = [];
    if (!activity.length) notes.push('Выбери книгу и нажми «Записать чтение», чтобы добавить страницы или минуты.');
    if (undated) notes.push('Книг без даты окончания — ' + undated + '. Дату можно добавить в карточке книги.');
    byId('year-note').textContent = notes.join(' ');
    const history = byId('history-list');
    activity.sort((a, b) => b.date.localeCompare(a.date));
    history.replaceChildren(...activity.map(session => {
      const row = element('li', '');
      const metrics = [session.pages ? session.pages + ' стр.' : '', session.minutes ? readTime(session.minutes) : ''].filter(Boolean);
      const data = element('span', readableDate(session.date) + ' · ' +
        (books.find(book => book.id === session.bookId)?.title ?? session.title) + ' · ' + metrics.join(' · '));
      const edit = element('button', 'Изменить');
      edit.onclick = () => openSession(books.find(book => book.id === session.bookId), session);
      const remove = element('button', 'Удалить');
      remove.onclick = () => {
        if (confirm('Удалить запись о чтении за ' + readableDate(session.date) + '?')) {
          save(books, sessions.filter(item => item.id !== session.id));
        }
      };
      const actions = element('div', '', 'history-actions');
      actions.append(edit, remove);
      row.append(data, actions);
      return row;
    }));
    byId('history').hidden = !activity.length;
  }

  function openSession(book, session) {
    sessionBook = book;
    editingSession = session;
    sessionForm.reset();
    const today = localDate();
    sessionFields.date.max = today;
    sessionFields.date.value = session?.date ?? today;
    sessionFields.pages.value = session?.pages || '';
    sessionFields.minutes.value = session?.minutes || '';
    byId('session-book').textContent = book?.title ?? session.title;
    byId('session-error').textContent = '';
    sessionDialog.showModal();
  }

  byId('close-session').onclick = () => { if (!writing) sessionDialog.close(); };
  sessionDialog.oncancel = event => { if (writing) event.preventDefault(); };
  sessionForm.onsubmit = async event => {
    event.preventDefault();
    if (writing) return;
    const pages = Number(sessionFields.pages.value);
    const minutes = Number(sessionFields.minutes.value);
    const date = sessionFields.date.value;
    if (!pages && !minutes) {
      byId('session-error').textContent = 'Укажи страницы или минуты.';
      return;
    }
    const entry = {
      id: editingSession?.id ?? crypto.randomUUID(),
      bookId: sessionBook?.id ?? editingSession.bookId,
      title: sessionBook?.title ?? editingSession.title,
      date, pages, minutes
    };
    const next = editingSession ? sessions.map(item => item.id === entry.id ? entry : item) : [entry, ...sessions];
    if (await save(books, next)) {
      yearSelect.value = date.slice(0, 4);
      renderReview();
      sessionDialog.close();
    } else {
      byId('session-error').textContent = notice.textContent;
    }
  };
  yearSelect.onchange = renderReview;

  byId('add').disabled = true;
  byId('add').onclick = () => openEditor();
  function closeEditor() {
    if (!writing) editor.close();
  }
  byId('cancel').onclick = closeEditor;
  byId('close-editor').onclick = closeEditor;
  editor.oncancel = event => { if (writing) event.preventDefault(); };
  byId('search').oninput = render;
  byId('filter').onchange = render;
  form.oninput = () => {
    fields.title.setCustomValidity('');
    fields.position.setCustomValidity('');
    fields.customGenre.setCustomValidity('');
  };
  fields.genre.onchange = updateGenre;
  fields.status.onchange = () => {
    if (fields.status.value === 'done' && !fields.finishedOn.value) fields.finishedOn.value = localDate();
    updateFinishedDate();
  };
  fields.unit.onchange = () => {
    fields.position.value = 0;
    fields.total.value = '';
    updateUnit();
  };
  byId('cover-remove').onclick = () => {
    coverRequest++;
    draftCover = '';
    fields.coverFile.value = '';
    byId('form-error').textContent = '';
    form.querySelector('button[type="submit"]').disabled = false;
    showCover();
  };
  fields.coverFile.onchange = async () => {
    const file = fields.coverFile.files[0];
    if (!file) return;
    const request = ++coverRequest;
    const submit = form.querySelector('button[type="submit"]');
    submit.disabled = true;
    byId('form-error').textContent = '';
    try {
      const cover = await resizeCover(file);
      if (request !== coverRequest || !editor.open) return;
      draftCover = cover;
      showCover();
    } catch (error) {
      if (request !== coverRequest || !editor.open) return;
      fields.coverFile.value = '';
      byId('form-error').textContent = file.size > 20 * 1024 * 1024
        ? error.message : 'Не удалось открыть изображение. Попробуйте JPG, PNG или WebP.';
    } finally {
      if (request === coverRequest) submit.disabled = false;
    }
  };
  form.onsubmit = async event => {
    event.preventDefault();
    const submit = form.querySelector('button[type="submit"]');
    if (submit.disabled || writing) return;
    const title = fields.title.value.trim();
    const unit = fields.unit.value;
    const total = unit === 'percent' ? 100 : Number(fields.total.value) || null;
    const position = Number(fields.position.value);
    const status = fields.status.value;
    const genre = fields.genre.value === customGenre ? fields.customGenre.value.trim() : fields.genre.value;
    if (!title) {
      fields.title.setCustomValidity('Введите название книги.');
      fields.title.reportValidity();
      return;
    }
    if (total && position > total) {
      fields.position.setCustomValidity('Текущий прогресс превышает максимальное значение.');
      fields.position.reportValidity();
      return;
    }
    if (fields.genre.value === customGenre && !genre) {
      fields.customGenre.setCustomValidity('Введите название жанра.');
      fields.customGenre.reportValidity();
      return;
    }
    const book = {
      id: editingId ?? crypto.randomUUID(),
      title, total, status, unit,
      updatedAt: new Date().toISOString(),
      finishedOn: status === 'done' ? fields.finishedOn.value : '',
      position: status === 'done' && total ? total : position,
      format: fields.format.value,
      genre,
      cover: draftCover,
      author: fields.author.value.trim(),
      note: fields.note.value.trim()
    };
    submit.disabled = true;
    if (await save(editingId ? books.map(item => item.id === editingId ? book : item) : [book, ...books])) {
      editor.close();
    } else {
      byId('form-error').textContent = notice.textContent;
    }
    submit.disabled = false;
  };
  render();
  renderReview();
  (async () => {
    try {
      database = await openDatabase();
      const stored = await readLibrary();
      const previous = stored ?? JSON.parse(localStorage.getItem(key) ?? '[]');
      const previousBooks = Array.isArray(previous) ? previous : previous?.books;
      if (!Array.isArray(previousBooks)) throw new Error();
      books = previousBooks;
      sessions = Array.isArray(previous.sessions) ? previous.sessions : [];
      render();
      renderReview();
      byId('add').disabled = false;
      catalogButton.disabled = false;
    } catch {
      notice.textContent = 'Не удалось загрузить сохранённую библиотеку.';
    }
  })();
</script>
</html>
